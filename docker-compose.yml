# ==============================================================================
# ShieldEDR / Wazuh EDR Deployment — Budget Cloud Instance Configuration
# Optimized for 4GB - 8GB RAM Linux Servers (Single-Node Architecture)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Wazuh Indexer (OpenSearch-based single node engine)
  # Memory allocation: 1.5 GB Heap (Resource Limit: 2.5 GB RAM)
  # ----------------------------------------------------------------------------
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.0
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - "discovery.type=single-node"
      - "DISABLE_INSTALL_DEMO_CONFIG=false"
      - "DISABLE_SECURITY_PLUGIN=false"
      - "bootstrap.memory_lock=false"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1024M
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    networks:
      - wazuh-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -k https://localhost:9200 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 2. Wazuh Manager (Correlates events, manages agents, applies EDR rules)
  # Memory allocation: Limit 1.5 GB RAM
  # ----------------------------------------------------------------------------
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: always
    ports:
      - "1514:1514/udp"   # Agent connection channel (UDP)
      - "1514:1514/tcp"   # Agent connection channel (TCP)
      - "1515:1515/tcp"   # Agent enrollment service
      - "55000:55000/tcp" # Wazuh REST API
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - ELASTICSEARCH_URL=https://wazuh.indexer:9200
    volumes:
      - ./local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - wazuh-api-config:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    networks:
      - wazuh-network
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'running' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 3. Wazuh Dashboard (Web UI for SIEM / EDR Management)
  # Memory allocation: Node heap 768 MB (Limit: 1 GB RAM)
  # ----------------------------------------------------------------------------
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "8443:5601"
    environment:
      - WAZUH_API_URL=https://wazuh.manager:55000
      - INDEXER_URL=https://wazuh.indexer:9200
      - NODE_OPTIONS=--max-old-space-size=768
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    networks:
      - wazuh-network

  # ----------------------------------------------------------------------------
  # 4. ShieldEDR Application (Lightweight MSME Streamlit Dashboard)
  # Memory allocation: Limit 512 MB RAM
  # ----------------------------------------------------------------------------
  shield.edr-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shield.edr-app
    restart: always
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - WAZUH_API_HOST=wazuh.manager
      - WAZUH_API_PORT=55000
      - SHIELD_DEMO_MODE=false
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      - wazuh.manager
    networks:
      - wazuh-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  wazuh-indexer-data:
  wazuh-api-config:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:

# ------------------------------------------------------------------------------
# Internal Security Network
# ------------------------------------------------------------------------------
networks:
  wazuh-network:
    driver: bridge
